name: Deploy interactive proof labs

on:
  push:
    branches: [main]
    paths:
      - publications.json
      - tools/check_publication.py
      - docs/**
      - one_black/**
      - clock_escape/**
      - wake_synthesis/**
      - factor_language/**
      - memory_feedback/**
      - four_cell_port/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          npm ci --prefix docs
          docs/node_modules/.bin/playwright install --with-deps chromium
      - name: Check exact exports and replay witnesses
        run: |
          python3 tools/check_publication.py
          node --check docs/app.js
          python3 -m json.tool docs/proof-map.json >/dev/null
          python3 docs/scripts/export_wake_factors.py --check
          python3 docs/scripts/export_memory.py --check
          python3 docs/scripts/export_ports.py --check
          npm test --prefix docs
      - name: Build and test the deployed artifact
        run: |
          python3 docs/scripts/build_site.py
          python3 docs/scripts/check_site.py
          npm run test:browser --prefix docs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
